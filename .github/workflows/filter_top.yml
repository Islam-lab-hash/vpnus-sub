name: Filter top locations

on:
  push:
    paths:
      - scripts/filter_top.py
      - .github/workflows/filter_top.yml
  workflow_run:
    workflows: ["Build subscription"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpnus-sub-filter
  cancel-in-progress: true

jobs:
  filter:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Filter and rename
        run: python scripts/filter_top.py
      - name: Verify filtered subscription
        run: |
          python - <<'PY'
          import base64
          import json
          import urllib.parse
          from pathlib import Path
          raw = Path('sub.txt').read_text(encoding='ascii').strip()
          data = base64.b64decode(raw, validate=True).decode('utf-8')
          links = [x for x in data.splitlines() if x.startswith('vless://')]
          assert 19 <= len(links) <= 22, f'Expected 19-22 configs, got {len(links)}'
          keys=[]
          for uri in links:
              p=urllib.parse.urlsplit(uri)
              q=tuple(sorted(urllib.parse.parse_qsl(p.query, keep_blank_values=True)))
              keys.append((p.username or '', (p.hostname or '').lower(), p.port, q))
          assert len(keys)==len(set(keys)), 'Technical duplicates remain'
          st=json.loads(Path('selection-status.json').read_text(encoding='utf-8'))
          assert st['published_count']==len(links)
          print(f'FILTER_OK={len(links)} families={st["families"]}')
          PY
      - name: Publish filtered subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt selection-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish curated top locations"
            git push
          fi
