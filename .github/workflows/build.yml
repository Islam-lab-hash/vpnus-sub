name: Build subscription

on:
  push:
    paths:
      - sources.txt
      - scripts/build.py
      - scripts/filter_top.py
      - scripts/validate.py
      - scripts/shorten.py
      - scripts/publish_yandex.py
      - scripts/publish_vk.py
      - .github/workflows/build.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpnus-sub-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify scripts
        run: |
          set -euo pipefail
          python -m py_compile scripts/build.py
          python -m py_compile scripts/filter_top.py
          python -m py_compile scripts/validate.py
          python -m py_compile scripts/shorten.py
          python -m py_compile scripts/publish_yandex.py
          python -m py_compile scripts/publish_vk.py

      - name: Synchronize source subscription
        env:
          SOURCE_SUB_URL: ${{ secrets.SOURCE_SUB_URL }}
        run: |
          set -euo pipefail
          python scripts/build.py

      - name: Keep top distinct locations and clean names
        run: |
          set -euo pipefail
          python scripts/filter_top.py

      - name: Validate final public subscription
        run: |
          set -euo pipefail
          python scripts/validate.py

      - name: Create or verify Yandex short URL
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/shorten.py

      - name: Require successful remote synchronization
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('sync-status.json').read_text(encoding='utf-8'))
          if not status.get('remote_ok'):
              raise SystemExit('Remote synchronization failed: ' + ', '.join(status.get('errors', [])))

          selection = json.loads(Path('selection-status.json').read_text(encoding='utf-8'))
          print(
              f"REMOTE_SYNC_OK adapter={status['adapter']} remote={status['remote_count']} "
              f"curated={selection['published_count']} families={selection['families']}"
          )
          PY

      - name: Publish subscription and status to GitHub
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt sync-status.json selection-status.json
          if [ -f short-url.txt ]; then git add short-url.txt; fi

          if git diff --cached --quiet; then
            echo "GITHUB_PUBLISH_NO_CHANGES"
            exit 0
          fi

          git commit -m "Sync curated subscription"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "GITHUB_PUBLISH_OK"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying"
            sleep $((attempt * 2))
          done

          echo "GitHub publish failed after 3 attempts" >&2
          exit 1

      - name: Publish optional VK Cloud Object Storage mirror
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.VK_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.VK_S3_SECRET_ACCESS_KEY }}
          VK_S3_BUCKET: ${{ secrets.VK_S3_BUCKET }}
          VK_S3_ENDPOINT: https://hb.ru-msk.vkcs.cloud
          VK_S3_REGION: ru-msk
          VK_OBJECT_KEY: assets/cache/v3/6f29a1c4.dat
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${VK_S3_BUCKET:-}" ]; then
            echo "VK_MIRROR_DISABLED: VK_S3_ACCESS_KEY_ID / VK_S3_SECRET_ACCESS_KEY / VK_S3_BUCKET are not configured"
            exit 0
          fi
          python -m pip install --disable-pip-version-check -q boto3
          python scripts/publish_vk.py

      - name: Publish optional Yandex Object Storage mirror
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          YC_BUCKET: ${{ secrets.YC_BUCKET }}
          YC_OBJECT_KEY: assets/cache/v3/6f29a1c4.dat
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ] || [ -z "${YC_BUCKET:-}" ]; then
            echo "YANDEX_MIRROR_DISABLED: YC_ACCESS_KEY_ID / YC_SECRET_ACCESS_KEY / YC_BUCKET are not configured"
            exit 0
          fi
          python -m pip install --disable-pip-version-check -q boto3
          python scripts/publish_yandex.py
