name: Build subscription

on:
  push:
    paths:
      - sources.txt
      - scripts/build.py
      - .github/workflows/build.yml
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpnus-sub-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify script syntax
        run: python -m py_compile scripts/build.py
      - name: Build subscription
        env:
          SOURCE_SUB_URL: ${{ secrets.SOURCE_SUB_URL }}
        run: python scripts/build.py
      - name: Verify output
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode(Path("sub.txt").read_text().strip(), validate=True).decode("utf-8")
          links = [line for line in data.splitlines() if line.startswith("vless://")]
          assert len(links) >= 19, f"Expected >=19 configurations, got {len(links)}"
          assert len(links) == len(set(links)), "Duplicate configurations found"
          print(f"VALID_SUBSCRIPTION: {len(links)} VLESS configurations")
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          if ! git diff --cached --quiet; then
            git commit -m "Build subscription"
            git push
          fi
